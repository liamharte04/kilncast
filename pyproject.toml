[project]
name = "plant-twin"
version = "0.1.0"
description = "Open digital twin of a solar-powered synthetic methane plant, scheduled against real archived weather forecasts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "control"]
